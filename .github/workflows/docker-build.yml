name: Build, test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RESOURCE_GROUP: rg-workshop-photos-prod
  CONTAINER_APP: ca-workshop-photos-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for OIDC: lets the runner mint the short-lived token that azure/login
      # exchanges for an Azure access token. Without it the login step fails with a
      # missing-token error rather than an auth error, which is a confusing way to find out.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # BlobPhotoStorageTests talk to real blob storage rather than a mock, so they need an
      # emulator. --skipApiVersionCheck is required for this Azurite/Azure.Storage.Blobs
      # combination (see docs/LOCAL_DEV.md) — without it every blob call 400s. --blobHost
      # 0.0.0.0 is needed because the tests reach it from the runner, not from inside the
      # container. The other tests use SQLite via TestDbContextFactory, so no DB service.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; then echo "Azurite up"; exit 0; fi
            sleep 1
          done
          echo "Azurite failed to start within 30s"; docker logs azurite; exit 1

      # The gate: nothing is built, published or deployed if a test fails.
      - name: Test
        run: dotnet test MainProjectNumoPart.Tests --configuration Release --verbosity normal

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}

      # Federated (OIDC) auth — no Azure client secret is stored in this repo. The trust is
      # scoped to this repo + branch, and the service principal holds Contributor on the
      # Container App resource only, not the resource group or subscription.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy the immutable per-commit tag, NOT :latest. The app was originally pinned to
      # :latest, and re-pointing it at the same tag is a no-op — Azure sees an unchanged image
      # reference and won't reliably create a revision or pull the new bits. The SHA tag
      # guarantees a fresh revision every push, and makes rollback a one-liner:
      #   az containerapp update -n <app> -g <rg> --image ghcr.io/<repo>:<older-sha>
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}" \
            --output none
          echo "Deployed ${{ github.sha }}"
