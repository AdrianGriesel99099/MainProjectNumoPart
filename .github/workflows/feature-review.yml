name: Feature proposal review

on:
  schedule:
    # 02:00 UTC = 04:00 SAST -- one hour before the cloud "New feature" routine (05:00 SAST),
    # so anything approved overnight is sitting in docs/BACKLOG.md before that routine reads it.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Tools/FeatureReviewBot has no database or Azure access of its own -- it authenticates to
      # the site's own /api/bot/feature-proposals routes with a shared API key
      # (ApiKeyEndpointFilter), so every read/write flows through the same FeatureProposalService
      # the web app itself uses. No OIDC login step needed here, unlike the backup/deploy workflows.
      - name: Run the review bot
        env:
          FEATURE_REVIEW_SITE_BASE_URL: https://ca-workshop-photos-prod.purplestone-16d8bd9f.southafricanorth.azurecontainerapps.io/
          FEATURE_REVIEW_SITE_API_KEY: ${{ secrets.FEATURE_REVIEW_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEATURE_REVIEW_REPO_ROOT: ${{ github.workspace }}
        run: dotnet run --project Tools/FeatureReviewBot/FeatureReviewBot.csproj

      # Only approved proposals touch docs/BACKLOG.md (see the tool above) -- if nothing was
      # approved since the last run, `git diff` is empty and this step is a no-op.
      - name: Commit any newly-queued proposals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/BACKLOG.md; then
            git add docs/BACKLOG.md
            git commit -m "Queue approved feature proposal(s) for the feature-building routine"
            git push
          else
            echo "No approved proposals to queue."
          fi
