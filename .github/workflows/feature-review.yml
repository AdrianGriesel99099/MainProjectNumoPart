name: Feature proposal review

on:
  schedule:
    # 02:00 UTC = 04:00 SAST -- one hour before the cloud "New feature" routine (05:00 SAST),
    # so anything approved overnight is sitting in docs/BACKLOG.md before that routine reads it.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for OIDC: lets the runner mint the short-lived token that azure/login exchanges
      # for an Azure access token. Without it the login step fails with a missing-token error
      # rather than an auth error, which is a confusing way to find out.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # A dedicated App Registration (github-feature-review-bot), same reasoning as the backup
      # workflow's own separate identity: this one's blast radius is scoped to exactly two
      # database tables (see the SQL grant this identity was given), and can't touch the
      # Container App, blob storage, or the deploy pipeline even if compromised.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_FEATURE_BOT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Tools/FeatureReviewBot reuses AppDbContext directly (project reference into the main
      # app) so its schema knowledge can never drift from the real one. The connection string's
      # "Authentication=Active Directory Default" makes Microsoft.Data.SqlClient reuse the az-cli
      # session azure/login just established via OIDC -- no stored SQL credential anywhere.
      - name: Run the review bot
        env:
          FEATURE_REVIEW_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEATURE_REVIEW_REPO_ROOT: ${{ github.workspace }}
        run: dotnet run --project Tools/FeatureReviewBot/FeatureReviewBot.csproj

      # Only approved proposals touch docs/BACKLOG.md (see the tool above) -- if nothing was
      # approved since the last run, `git diff` is empty and this step is a no-op.
      - name: Commit any newly-queued proposals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/BACKLOG.md; then
            git add docs/BACKLOG.md
            git commit -m "Queue approved feature proposal(s) for the feature-building routine"
            git push
          else
            echo "No approved proposals to queue."
          fi
